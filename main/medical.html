<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Aid | StormReady Portal</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/main.js"></script>
</head>
<body>
    <header>
        <h1>Medical Aid Request</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="resources.html">Resources</a>
            <a href="evacuation.html">Evacuation Centers</a>
            <a href="medical.html">Medical Aid</a>
            <a href="mental-health.html">Mental Health</a>
            <a href="contact.html">Contact</a>
            <!--<a href="emergency-library.html">Emergency Library</a>-->
        </nav>
    </header>

    <section class="medical-assistance-grid">
        <div class="form-container">
            <h2>Request Medical Assistance</h2>
            <form id="medical-form">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Enter your full name" required>
                </div>
    
                <div class="form-group">
                    <label for="location">Location</label>
                    <input type="text" id="location" placeholder="Enter your city or zip code" required>
                </div>
    
                <div class="form-group">
                    <label for="condition">Medical Condition</label>
                    <textarea id="condition" rows="4" placeholder="Brief description of the condition" required></textarea>
                </div>
    
                <button type="submit" class="submit-btn">Submit Request</button>
            </form>
        </div>
    
        <div class="map-container">
            <h3>Nearest Medical Facility</h3>
            <div id="hospital-map"></div>
        </div>
    </section>
    
    

    <footer>
        <div class="footer-content">
            <p>&copy; 2025 StormReady Resource Portal | Designed for South Florida Residents</p>
            <div class="social-icons">
                <a href="#"><i class="fa fa-facebook"></i></a>
                <a href="#"><i class="fa fa-twitter"></i></a>
                <a href="#"><i class="fa fa-instagram"></i></a>
            </div>
        </div>
    </footer>
</body>
</html>
