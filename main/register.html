<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register | StormReady Portal</title>
  <script type="module" src="js/register.js" defer></script>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
</head>
<body>
  <div class="auth-container">
    <h2>Create Account</h2>
    <form id="login-form">
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit" class="auth-button">Register</button>
    </form>
    <div id="message"></div>
    <p class="auth-switch">Already registered? <a href="login.html">Login</a></p>
  </div>


  <script>
    const messageDiv = document.getElementById('message');
    messageDiv.textContent = "Please register and then click Login to continue.";
    messageDiv.style.color = "green";
  </script>
</body>
</html>
