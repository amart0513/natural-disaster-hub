<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | StormReady Portal</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
</head>
<body>
    <header>
        <h1>Contact Us</h1>
        <nav>
            <nav>
                <a href="index.html">Home</a>
                <a href="resources.html">Resources</a>
                <a href="evacuation.html">Evacuation Centers</a>
                <a href="medical.html">Medical Aid</a>
                <a href="mental-health-support.html">Mental Health Support</a>
                <a href="contact.html">Contact</a>
            </nav>
        </nav>
    </header>

    <section class="contact-form">
        <h2>Get in Touch</h2>
        <form>
            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" placeholder="Enter your name" required>
            </div>
            
            <div class="form-group">
                <label for="email">Your Email</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>
    
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" rows="5" placeholder="Your message" ></textarea>
            </div>
    
            <button type="submit" class="submit-btn">Submit Inquiry</button>
        </form>
    </section>
    

    <footer>
        <div class="footer-content">
            <p>&copy; 2025 StormReady Resource Portal | Designed for South Florida Residents</p>
        </div>
    </footer>
</body>
</html>
